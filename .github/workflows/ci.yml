name: ci

on:
  push:
    branches: [main, mvp-initial-dna-gpt, add-real-data-quickstart, add-sharded-window-dataset]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest
        run: pytest
      - name: Device check
        run: python scripts/check_device.py
      - name: Compile Streamlit app
        run: python -m py_compile apps/dna_chat.py
      - name: Dummy smoke pipeline
        run: |
          python scripts/inspect_fasta.py tests/fixtures/dummy.fa
          python scripts/prepare_windows.py tests/fixtures/dummy.fa --out-dir data/processed_dummy --block-size 32 --stride 16 --max-n-rate 1.0 --max-windows 4
          python scripts/train.py --train-path data/processed_dummy/train.txt --val-path data/processed_dummy/val.txt --run-dir runs/dummy --max-steps 10 --batch-size 2 --n-layer 1 --n-head 1 --n-embd 32 --block-size 32 --device cpu
          python scripts/generate.py --checkpoint runs/dummy/ckpt_step_10.pt --prefix ACGT --max-new-tokens 32 --device cpu
          python scripts/eval_markov.py --train-path data/processed_dummy/train.txt --test-path data/processed_dummy/test.txt --checkpoint runs/dummy/ckpt_step_10.pt --device cpu
      - name: Sharded streaming smoke pipeline
        run: |
          python scripts/prepare_windows.py tests/fixtures/dummy.fa --out-dir data/processed_sharded_dummy --block-size 32 --stride 16 --max-n-rate 1.0 --max-windows 4 --shard --shard-size 2 --train-ratio 0.25 --val-ratio 0.25
          python scripts/train.py --train-path data/processed_sharded_dummy/train --val-path data/processed_sharded_dummy/val --run-dir runs/sharded_dummy --max-steps 2 --batch-size 2 --n-layer 1 --n-head 1 --n-embd 32 --block-size 32 --device cpu --streaming
          python scripts/eval_markov.py --train-path data/processed_sharded_dummy/train --test-path data/processed_sharded_dummy/test --checkpoint runs/sharded_dummy/ckpt_step_2.pt --device cpu --streaming
      - name: Real quickstart smoke without network
        run: |
          python scripts/run_real_quickstart.py --fasta-path tests/fixtures/dummy.fa --profile quick --block-size 32 --stride 16 --max-steps 2 --batch-size 2 --device cpu --run-dir runs/quickstart_dummy --processed-dir data/processed_quickstart_dummy
          python scripts/run_real_quickstart.py --fasta-path tests/fixtures/dummy.fa --profile 5m --block-size 32 --stride 16 --max-windows 8 --max-steps 2 --batch-size 2 --device cpu --run-dir runs/quickstart_sharded_dummy --processed-dir data/processed_quickstart_sharded_dummy
